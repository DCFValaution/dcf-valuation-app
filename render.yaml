# Render Blueprint for the DCF valuation API and the web (PWA) build.
#
# Two services from one repository: the FastAPI backend, and a static site
# holding the Flutter web app. Both redeploy when main is pushed.
#
# With this file in the repository root, Render can configure the whole
# service from "New > Blueprint" - no build or start command typed by hand,
# and the settings live in version control alongside the code.
#
# NO SECRETS ARE NEEDED. The backend reads Yahoo Finance via yfinance, which
# requires no credentials, so there is no environment variable to set and
# nothing to leak. The previous FMP_API_KEY is gone entirely.

services:
  - type: web
    name: dcf-valuation-api
    runtime: python
    plan: free

    # Free instances are available in these regions; change if you prefer
    # one closer to you.
    region: oregon

    buildCommand: pip install -r requirements.txt

    # Render assigns the port at runtime and expects the process to bind it.
    # Binding 0.0.0.0 rather than 127.0.0.1 is what makes the service
    # reachable from outside its container - a loopback bind produces a
    # service that starts cleanly and then times out on every request.
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT

    # Cheap endpoint that touches no upstream service, so a Yahoo outage
    # cannot make Render think the app itself is unhealthy.
    healthCheckPath: /health

    envVars:
      # The code needs 3.10+ for PEP 604 unions and uses nothing newer than
      # 3.11 syntax; 3.13 has the widest wheel coverage for pandas/numpy.
      - key: PYTHON_VERSION
        value: "3.13.4"

      # Keeps pip from spending build minutes checking for its own upgrade.
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: "1"

      # Which browser origins may read this API's responses.
      #
      # PRODUCTION IS EXACTLY THIS ONE ORIGIN: the static site below. A
      # browser refuses to hand a response to a page from anywhere else, so a
      # random site cannot spend this instance's rate-limit budget through a
      # visitor's browser.
      #
      # This variable REPLACES the localhost and LAN defaults compiled into
      # api.py. Those defaults still serve local development, where the
      # variable is simply unset; nothing in production depends on them.
      #
      # Serving the web app from a custom domain later means adding that
      # origin here (comma separated), not replacing the scheme or adding a
      # path - an origin is scheme + host + port and nothing else.
      - key: ALLOWED_ORIGINS
        value: https://intrinsic-web.onrender.com

  # -------------------------------------------------------------------------
  # The web (PWA) build: static files only, no server of its own.
  # -------------------------------------------------------------------------
  - type: web
    name: intrinsic-web
    runtime: static
    plan: free
    region: oregon

    # Flutter is not in Render's build image; the script fetches a pinned SDK
    # and builds app/build/web from the same source the Android app is built
    # from.
    buildCommand: ./tools/render_build_web.sh
    staticPublishPath: app/build/web

    routes:
      # A single-page app: every path must return index.html, or a reload on
      # any route the app pushes would 404. Render tries real files first, so
      # main.dart.js and the icons are unaffected.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # The service worker must never be served from cache, or a browser can
      # pin an old build indefinitely and users stop receiving updates.
      - path: /flutter_service_worker.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

      # Security headers.
      #
      # The policy below was tested against a real release build served
      # locally with exactly these headers: the app booted, CanvasKit and
      # Roboto loaded from gstatic, and a fetch to the API returned 200 -
      # while a fetch to an origin outside connect-src was refused. A CSP
      # that breaks the app would help nobody, so it was checked rather than
      # reasoned about.
      #
      # Why each source is here:
      #   script-src   the engine's loader is inlined into index.html, and
      #                CanvasKit is WebAssembly, which needs wasm-unsafe-eval
      #   font-src     Roboto comes from fonts.gstatic.com
      #   connect-src  the app calls exactly one API and nothing else
      #   worker-src   the service worker is created from a blob URL
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com;
          style-src 'self' 'unsafe-inline';
          font-src 'self' https://fonts.gstatic.com data:;
          img-src 'self' data: blob:;
          connect-src 'self' https://dcf-valuation-api.onrender.com https://www.gstatic.com https://fonts.gstatic.com;
          worker-src 'self' blob:;
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'none'

      # Nothing here is meant to be embedded in another site, and the
      # clickjacking this prevents matters more than usual on a page whose
      # whole output is a number someone might act on.
      - path: /*
        name: X-Frame-Options
        value: DENY

      # Render already sends this, but it belongs in version control rather
      # than depending on a platform default that can change.
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      # A ticker is not secret, but it is the user's interest and it has no
      # business travelling to gstatic in a Referer header.
      - path: /*
        name: Referrer-Policy
        value: no-referrer

      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
