<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `flutter build`'s --base-href. It stays "/" for a
    site served from its own domain root; a project served from a subfolder
    (e.g. GitHub Pages) needs "/<folder>/" or none of the assets resolve.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
        content="A discounted cash flow model built from a company's own filings - not from anyone's opinion of it.">

  <!--
    viewport-fit=cover lets the page paint under the iPhone's notch and home
    indicator, which a home-screen app must do or it is letterboxed in black.
    user-scalable=no keeps a double-tap from zooming the canvas; the app's own
    text scales with the system font size setting.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- The browser UI's colour when the page is shown with browser chrome. -->
  <meta name="theme-color" content="#3A5BD9">

  <!--
    Home-screen behaviour. iOS Safari ignores the web manifest's "display"
    field, so apple-mobile-web-app-capable is what actually removes the
    browser's address bar and toolbar after "Add to Home Screen".
    black-translucent puts the page behind the status bar, matching the app's
    own background rather than a black band.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Intrinsic">
  <!-- iOS uses this one, and applies its own rounded mask to it. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    The engine's two big downloads come from other origins: CanvasKit from
    www.gstatic.com and the Roboto font from fonts.gstatic.com. Opening those
    connections now, while index.html is still parsing, takes the DNS lookup
    and TLS handshake off the critical path - on a phone's cellular link that
    is a few hundred milliseconds each, paid before the first frame.
  -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>Intrinsic</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      The ground behind the Flutter canvas, painted before the app boots and
      visible for a moment on a cold load. It follows the system theme so the
      first frame is not a white flash on a dark phone.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #F5F7FA;
      overscroll-behavior: none;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0B0E13; }
    }
    /*
      The branded splash, shown until the app can actually respond - not just
      until its first frame is painted. On an iPhone the first frame lands a
      few seconds in, and the main thread then stalls for another second or
      two while the framework finishes warming up; an interface that is drawn
      but not yet answering reads as frozen, so the splash stays over it until
      the main thread has gone quiet. The spinner is a compositor animation,
      so it keeps turning even while the main thread is busy.

      It sits above the app and receives taps, so a tap during loading is
      acknowledged ("Almost ready") rather than landing on an interface the
      user cannot see, or on nothing at all.
    */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background-color: #F5F7FA;
      transition: opacity 160ms ease-out;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #boot.leaving { opacity: 0; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      #boot { background-color: #0B0E13; }
    }
    #boot img { width: 88px; height: 88px; border-radius: 20px; }
    #boot .spinner {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid rgba(58, 91, 217, 0.18);
      border-top-color: #3A5BD9;
      animation: boot-spin 0.9s linear infinite;
    }
    #boot .label { font-size: 14px; color: #5B6478; letter-spacing: 0.01em; }
    #boot .label.acknowledged { color: #3A5BD9; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      #boot .spinner { border-color: rgba(142, 163, 255, 0.18); border-top-color: #8EA3FF; }
      #boot .label { color: #98A2B3; }
      #boot .label.acknowledged { color: #8EA3FF; }
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }

    /* Opt-in timeline for diagnosing startup on a real phone: add ?diag=1. */
    #diag {
      position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 2147483647;
      max-height: 40vh; overflow: auto; padding: 8px 10px; border-radius: 10px;
      background: rgba(0, 0, 0, 0.82); color: #9FE870;
      font: 11px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="boot" role="progressbar" aria-label="Loading Intrinsic">
    <img src="icons/Icon-192.png" alt="">
    <div class="spinner"></div>
    <div class="label">Loading Intrinsic…</div>
  </div>
  <script>
    // Opt-in startup timeline, drawn on screen so it can be read on a phone
    // with no desktop attached. Inert unless the URL carries ?diag=1. Records
    // when the first frame lands, every stall of the page's main thread, every
    // tap the page receives, and when the server wake-up ping goes out and
    // comes back - the four things a frozen-looking start could be.
    (function () {
      if (!/[?&]diag=1/.test(location.search)) return;
      var t0 = performance.now();
      var lines = [];
      var box = null;
      function ms() { return Math.round(performance.now() - t0); }
      function log(text) {
        lines.push(ms() + 'ms  ' + text);
        if (!box) {
          box = document.createElement('div');
          box.id = 'diag';
          document.body.appendChild(box);
        }
        box.textContent = lines.slice(-40).join(String.fromCharCode(10));
      }
      window.addEventListener('flutter-first-frame', function () {
        log('first frame');
        // Which renderer and binary actually loaded, from what was fetched.
        var names = performance.getEntriesByType('resource').map(function (r) {
          return r.name.split('?')[0].split('/').pop();
        });
        var renderer = names.indexOf('canvaskit.wasm') >= 0 ? 'canvaskit'
          : names.some(function (n) { return /^skwasm/.test(n); }) ? 'skwasm' : '?';
        var binary = names.indexOf('main.dart.wasm') >= 0 ? 'wasm'
          : names.indexOf('main.dart.js') >= 0 ? 'js' : '?';
        log('renderer ' + renderer + ' + ' + binary);
      });
      window.addEventListener('intrinsic-ready', function (e) {
        log('splash removed (' + e.detail + ') - app responding');
      });
      window.addEventListener('intrinsic-tap-during-load', function () {
        log('tap during load - acknowledged on the splash');
      });
      // event.timeStamp is when the phone created the touch; the handler runs
      // when the page gets to it. The gap is how long the tap sat in a queue
      // behind a busy main thread - the direct measure of "unresponsive".
      ['pointerdown', 'touchstart'].forEach(function (type) {
        window.addEventListener(type, function (e) {
          var queued = Math.max(0, Math.round(performance.now() - e.timeStamp));
          log(type + (queued > 30 ? ' (queued ' + queued + 'ms)' : ''));
        }, true);
      });
      var last = performance.now();
      setInterval(function () {
        var now = performance.now();
        if (now - last > 250) log('main thread stalled ' + Math.round(now - last) + 'ms');
        last = now;
      }, 50);
      var realFetch = window.fetch;
      if (realFetch) {
        window.fetch = function (input) {
          var url = String(input && input.url || input);
          var watch = /\/health|\/search|\/valuation/.test(url);
          if (watch) log('-> ' + url.replace(/^https?:\/\/[^/]+/, ''));
          return realFetch.apply(this, arguments).then(function (r) {
            if (watch) log('<- ' + r.status + ' ' + url.replace(/^https?:\/\/[^/]+/, ''));
            return r;
          }, function (e) {
            if (watch) log('x  ' + url.replace(/^https?:\/\/[^/]+/, ''));
            throw e;
          });
        };
      }
      var realOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        var u = String(url);
        if (/\/health|\/search|\/valuation/.test(u)) {
          var path = u.replace(/^https?:\/\/[^/]+/, '');
          log('-> ' + path);
          this.addEventListener('loadend', function () { log('<- ' + this.status + ' ' + path); });
        }
        return realOpen.apply(this, arguments);
      };
      log('page started');
    })();
  </script>
  <script>
    // When the splash leaves: after the first frame AND once the main thread
    // has stayed free of stalls for QUIET_MS - the point at which a tap is
    // actually answered. Capped at MAX_WAIT_MS after the first frame, so a
    // phone that keeps stuttering still gets its app rather than a spinner.
    (function () {
      var QUIET_MS = 300, STALL_MS = 100, MAX_WAIT_MS = 4000;
      var boot = document.getElementById('boot');
      var label = boot && boot.querySelector('.label');
      var firstFrameAt = null, quietSince = null, last = performance.now();

      // A tap on the splash is not lost silently: it is answered.
      if (boot) {
        boot.addEventListener('pointerdown', function () {
          if (!label) return;
          label.textContent = firstFrameAt === null
            ? 'Still loading \u2014 one moment'
            : 'Almost ready \u2014 one moment';
          label.classList.add('acknowledged');
          window.dispatchEvent(new CustomEvent('intrinsic-tap-during-load'));
        });
      }

      function leave(reason) {
        if (!boot || boot.classList.contains('leaving')) return;
        boot.classList.add('leaving');
        window.dispatchEvent(new CustomEvent('intrinsic-ready', {detail: reason}));
        setTimeout(function () { boot.remove(); }, 200);
      }

      var sampler = setInterval(function () {
        var now = performance.now(), gap = now - last;
        last = now;
        if (firstFrameAt === null) return;
        if (gap > STALL_MS) { quietSince = null; return; }
        if (quietSince === null) quietSince = now;
        if (now - quietSince >= QUIET_MS) { clearInterval(sampler); leave('settled'); }
        else if (now - firstFrameAt >= MAX_WAIT_MS) { clearInterval(sampler); leave('cap'); }
      }, 25);

      window.addEventListener('flutter-first-frame', function () {
        firstFrameAt = performance.now();
        quietSince = null;
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
